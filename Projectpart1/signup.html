<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="mobile-container">
        <div class="logo-area">
            <img src="/images/logo.jpg" alt="Cup Logo" style="height: 60px;" onerror="this.style.display='none'">
            <br>FIFA WORLD CUP
        </div>
        
        <div class="form-container">
            <input type="text" placeholder="Username">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <input type="password" placeholder="Confirm Password">
            
            <button class="btn-green" onclick="window.location.href='fixtures.html'">Sign Up</button>
            <a href="#" class="text-link">Login</a>
        </div>

        <div class="social-icons">
            <img src="/images/instagram.svg" alt="IG" style="width: 20px; height: 20px;"> 
            <img src="/images/twitter.svg" alt="Twitter" style="width: 20px; height: 20px;"> 
            <img src="/images/facebook.svg" alt="FB" style="width: 20px; height: 20px;">
        </div>
    </div>
</body>
</html>
