<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="mobile-container">
        <img src="./images/Menubutton.png" class="hamburger" alt="Menu" onclick="toggleMenu()">
<!--
        <nav class="side-menu" id="sideMenu">
            <a href="signup.html">Sign Up</a>
            <a href="features.html">Featured Games</a>
            <a href="bet.html">Place Your Bet</a>
        </nav>
    -->
        <div class="cart-container">
            <img src="./images/cart.jpg" class="cart-icon" alt="Cart">
            <div class="cart-badge" id="cartBadge" style="display: none;">0</div>
        </div>

        <div class="logo-area">
            <img src="./images/logo.jpg" alt="Cup Logo" onerror="this.style.display='none'">
        </div>
        
        <div class="signup-form-container">
            <div class="app-title">World Cup bet app</div>
            
            <input type="text" id="username" class="signup-input" placeholder="Username">
            <input type="email" id="email" class="signup-input" placeholder="Email">
            <input type="password" id="password" class="signup-input" placeholder="Password">
            <input type="password" id="confirmPassword" class="signup-input" placeholder="Confirm Password">
            
            <button class="btn-signup" onclick="handleSignup()">Sign Up</button>
            
            <a href="#" class="text-link">Login</a>
            <div id="authMessage" style="display: none; padding: 10px; border-radius: 8px; text-align: center;"></div>
        </div>

        <div class="social-icons">
            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="./images/instagram.svg" alt="Instagram">
            </a>

            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">
                <img src="./images/twitter.svg" alt="Twitter">
            </a>

            <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="./images/facebook.svg" alt="Facebook">
            </a>
        </div>
    </div>

    <script src="./js/validation.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
