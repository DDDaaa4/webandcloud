<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Featured Games</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="mobile-container">
        <img src="./images/Menubutton.png" class="hamburger" alt="Menu" onclick="toggleMenu()">

        <nav class="side-menu" id="sideMenu">
            <a href="signup.html">Sign Up</a>
            <a href="features.html">Featured Games</a>
            <a href="bet.html">Place Your Bet</a>
        </nav>
        
        <div class="cart-container">
            <img src="./images/cart.jpg" class="cart-icon" alt="Cart">
            <div class="cart-badge" id="cartBadge" style="display: none;">0</div>
        </div>

        <div class="logo-area">
            <img src="./images/logo.jpg" alt="FIFA WORLD CUP">
        </div>
        
        <h2 class="page-title">Featured Games</h2>

        <div class="carousel-wrapper">
            <div class="arrow arrow-left" onclick="prevMatch()">&#9664;</div>
            <div class="grey-card" id="featureCard"></div>
            <div class="arrow arrow-right" onclick="nextMatch()">&#9654;</div>
        </div>

        <button class="btn-place-features" onclick="goToBet()">Place your bet</button>

        <div class="social-icons">
            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="./images/instagram.svg" alt="Instagram">
            </a>

            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">
                <img src="./images/twitter.svg" alt="Twitter">
            </a>

            <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="./images/facebook.svg" alt="Facebook">
            </a>
        </div>
    </div>

    <script src="./js/app.js"></script>
</body>
</html>
