<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Place Your Bet</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/data.js"></script>
</head>
<body>
    <div class="mobile-container">
        <img src="/images/Menubutton.png" class="hamburger" alt="Menu">
        <div class="logo-area">
            <img src="/images/logo.jpg" alt="Cup Logo" onerror="this.style.display='none'">
        </div>
        
        <div class="page-content">
            <h2>Place your bet</h2>

            <div class="carousel-wrapper">
                <div class="arrow">&#9664;</div> 
                <div class="grey-card" id="betCard" style="padding-bottom: 20px;">
                    </div>
                <div class="arrow">&#9654;</div>
            </div>

            <div class="bet-bottom-buttons">
                <button class="btn-cancel" onclick="window.location.href='fixtures.html'">Cancel</button>
                <button class="btn-place">Place bet</button>
            </div>
        </div>

        <div class="social-icons">
            <img src="/images/instagram.svg" alt="IG" style="width: 26px; height: 28px;"> 
            <img src="/images/twitter.svg" alt="Twitter" style="width: 26px; height: 28px;"> 
            <img src="/images/facebook.svg" alt="FB" style="width: 26px; height: 28px;">
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('id') || matchesData[0].id;
        const match = matchesData.find(m => m.id === matchId);
        
        // Setup initial default state (Home Team Win)
        window.selectedOdds = match.odds.home;
        window.selectedTeam = match.homeTeam;

        function renderBetCard() {
            const card = document.getElementById('betCard');
            // Injecting HTML with onClick commands tied to the elements
            card.innerHTML = `
                <h3>Match ${match.matchNum}</h3>
                <div class="match-teams">
                    <div class="team-col" onclick="selectTeam('${match.homeTeam}', ${match.odds.home})">
                        ${match.homeTeam}
                        <img src="${match.homeFlag}" alt="${match.homeCode}" onerror="this.src='https://via.placeholder.com/50x35'">
                    </div>
                    <div class="vs">VS</div>
                    <div class="team-col" onclick="selectTeam('${match.awayTeam}', ${match.odds.away})">
                        ${match.awayTeam}
                        <img src="${match.awayFlag}" alt="${match.awayCode}" onerror="this.src='https://via.placeholder.com/50x35'">
                    </div>
                </div>
                <div class="match-date">${match.date}</div>
                <div class="odds-container">
                    <div class="odd-box" onclick="selectTeam('${match.homeTeam}', ${match.odds.home})">${match.homeCode} - ${match.odds.home}</div>
                    <div class="odd-box" onclick="selectTeam('Draw', ${match.odds.draw})">Draw - ${match.odds.draw}</div>
                    <div class="odd-box" onclick="selectTeam('${match.awayTeam}', ${match.odds.away})">${match.awayCode} - ${match.odds.away}</div>
                </div>
                
                <div class="bet-pill-container">
                    <div class="bet-label">Selection</div>
                    <div class="bet-pill" id="selectionLabel">${window.selectedTeam} Win</div>
                    
                    <div class="bet-label">Bet amount</div>
                    <div class="bet-pill">
                        <input type="text" id="stakeInput" value="10$" oninput="calculateWin()">
                    </div>
                    
                    <div class="bet-label">Potential win</div>
                    <div class="bet-pill" id="potentialWin">${(10 * window.selectedOdds).toFixed(1)}$</div>
                </div>
            `;
        }

        // Logic function to handle when a user clicks a flag or an odds box
        function selectTeam(teamName, odds) {
            window.selectedTeam = teamName;
            window.selectedOdds = odds;
            document.getElementById('selectionLabel').innerText = teamName === 'Draw' ? 'Draw' : teamName + ' Win';
            calculateWin();
        }

        // Logic function to calculate the dynamic money values
        function calculateWin() {
            // Strip out the $ symbol when calculating to ensure JS can do the math
            let val = document.getElementById('stakeInput').value.replace('$', '');
            const stake = parseFloat(val);
            const winBox = document.getElementById('potentialWin');
            if(stake && stake > 0) {
                winBox.innerText = (stake * window.selectedOdds).toFixed(1) + '$';
            } else {
                winBox.innerText = '0$';
            }
        }

        // Run the render on load
        renderBetCard();
    </script>
</body>
</html>
