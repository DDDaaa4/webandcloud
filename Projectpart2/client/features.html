<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Matches</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="mobile-container">
        <img src="./images/MenuButton.png" class="hamburger" alt="Menu" onclick="toggleMenu()">
        <a href="leaderboard.html" class="header-icon" aria-label="Leaderboard">🏆</a>
        <nav class="side-menu" id="sideMenu">
            <a href="index.html">Home</a>
            <a href="signup.html">Sign Up</a>
            <a href="login.html">Login</a>
            <a href="my-predictions.html">My Predictions</a>
            <a href="leaderboard.html">Leaderboard</a>
            <button type="button" onclick="logoutUser()">Logout</button>
        </nav>

        <div class="logo-area">
            <a href="./index.html" class="logo-link" aria-label="Go to home page">
                <img src="./images/logo.jpg" alt="FIFA World Cup logo">
            </a>
        </div>

        <h1 class="page-title">Featured Matches</h1>

        <div class="toolbar">
            <input id="teamSearch" class="input" placeholder="Search team">
            <select id="statusFilter" class="select-input">
                <option value="">All matches</option>
                <option value="upcoming">Upcoming</option>
                <option value="finished">Finished</option>
            </select>
            <button class="btn-secondary" onclick="loadMatches()">Filter</button>
        </div>

        <div id="messageBox" class="message"></div>

        <div class="carousel-wrapper">
            <div class="arrow" onclick="prevMatch()">&#9664;</div>
            <div class="grey-card" id="featureCard"></div>
            <div class="arrow" onclick="nextMatch()">&#9654;</div>
        </div>

        <button class="btn-place-features" onclick="goToPrediction()">Submit Prediction</button>

        <div class="social-icons">
            <a href="https://www.instagram.com/fifaworldcup" target="_blank" rel="noopener noreferrer"><img src="./images/instagram.svg" alt="Instagram"></a>
            <a href="https://twitter.com/FIFAWorldCup" target="_blank" rel="noopener noreferrer"><img src="./images/twitter.svg" alt="Twitter"></a>
            <a href="https://www.facebook.com/fifaworldcup" target="_blank" rel="noopener noreferrer"><img src="./images/facebook.svg" alt="Facebook"></a>
        </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/menu.js"></script>
    <script src="./js/matches.js"></script>
</body>
</html>
