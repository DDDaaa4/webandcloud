<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="mobile-container">
        <img src="./images/MenuButton.png" class="hamburger" alt="Menu" onclick="toggleMenu()">
        <a href="leaderboard.html" class="header-icon" aria-label="Leaderboard">🏆</a>
        <nav class="side-menu" id="sideMenu">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="features.html">Featured Matches</a>
            <a href="my-predictions.html">My Predictions</a>
            <a href="leaderboard.html">Leaderboard</a>
        </nav>

        <div class="logo-area">
            <a href="./index.html" class="logo-link" aria-label="Go to home page">
                <img src="./images/logo.jpg" alt="FIFA World Cup logo">
            </a>
        </div>

        <div class="signup-form-container">
            <h1 class="app-title">World Cup Prediction App</h1>

            <input type="text" id="username" class="signup-input" placeholder="Username" autocomplete="username">
            <input type="email" id="email" class="signup-input" placeholder="Email" autocomplete="email">
            <input type="password" id="password" class="signup-input" placeholder="Password" autocomplete="new-password">
            <input type="password" id="confirmPassword" class="signup-input" placeholder="Confirm Password" autocomplete="new-password">

            <button class="btn-signup" onclick="handleSignup()">Sign Up</button>
            <a href="login.html" class="text-link">Already have an account? Login</a>
            <div id="authMessage" class="message"></div>
        </div>

        <div class="social-icons">
            <a href="https://www.instagram.com/fifaworldcup" target="_blank" rel="noopener noreferrer"><img src="./images/instagram.svg" alt="Instagram"></a>
            <a href="https://twitter.com/FIFAWorldCup" target="_blank" rel="noopener noreferrer"><img src="./images/twitter.svg" alt="Twitter"></a>
            <a href="https://www.facebook.com/fifaworldcup" target="_blank" rel="noopener noreferrer"><img src="./images/facebook.svg" alt="Facebook"></a>
        </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/menu.js"></script>
    <script src="./js/auth.js"></script>
</body>
</html>
