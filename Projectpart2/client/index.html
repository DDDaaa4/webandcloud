<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Prediction App</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="mobile-container">
        <img src="./images/MenuButton.png" class="hamburger" alt="Menu" onclick="toggleMenu()">
        <a href="leaderboard.html" class="header-icon" aria-label="Leaderboard">🏆</a>
        <nav class="side-menu" id="sideMenu">
            <a href="signup.html">Sign Up</a>
            <a href="login.html">Login</a>
            <a href="features.html">Featured Matches</a>
            <a href="my-predictions.html">My Predictions</a>
            <a href="leaderboard.html">Leaderboard</a>
            <button type="button" onclick="logoutUser()">Logout</button>
        </nav>

        <div class="logo-area">
            <a href="./index.html" class="logo-link" aria-label="Go to home page">
                <img src="./images/logo.jpg" alt="FIFA World Cup logo">
            </a>
        </div>

        <h1 class="app-title">World Cup Prediction App</h1>
        <p class="page-subtitle">Predict match results, manage your predictions, and climb the leaderboard.</p>

        <div class="button-row">
            <button class="btn" onclick="location.href='signup.html'">Create Account</button>
            <button class="btn-secondary" onclick="location.href='login.html'">Login</button>
            <button class="btn" onclick="location.href='features.html'">View Matches</button>
        </div>

        <div class="social-icons">
            <a href="https://www.instagram.com/fifaworldcup" target="_blank" rel="noopener noreferrer"><img src="./images/instagram.svg" alt="Instagram"></a>
            <a href="https://twitter.com/FIFAWorldCup" target="_blank" rel="noopener noreferrer"><img src="./images/twitter.svg" alt="Twitter"></a>
            <a href="https://www.facebook.com/fifaworldcup" target="_blank" rel="noopener noreferrer"><img src="./images/facebook.svg" alt="Facebook"></a>
        </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/menu.js"></script>
</body>
</html>
